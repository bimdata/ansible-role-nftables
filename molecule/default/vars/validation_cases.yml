---
validation_cases:
  # Tables
  - name: "Duplicate table"
    tables:
      - table: ip filter
    error: "nftables_zz_test_tables: table 'ip filter' is already defined in: 'nftables_filter_tables'."

  - name: "Table with an invalid family"
    tables:
      - table: inet4 main
    error: "nftables_zz_test_tables: table 'inet4 main' must be in format '<family> <name>'."

  - name: "Table without family"
    tables:
      - table: main
    error: "nftables_zz_test_tables: table 'main' must be in format '<family> <name>'."

  - name: "Table without table key"
    tables:
      - name: main
        family: inet
    error: "nftables_zz_test_tables: table '' must be in format '<family> <name>'."

  - name: "Default table undefined"
    table_use_by_default: main
    error: "nftables_table_use_by_default: reference an undefined table 'main'."

  # Chains
  - name: "Chain in an undefined table"
    chains:
      - name: prerouting
        table: ip fliter
    error: "nftables_zz_test_chains: reference an undefined table 'ip fliter'."

  - name: "Chain without name"
    chains:
      - table: inet main
    error: "nftables_zz_test_chains: chain definition"

  - name: "Duplicated chain"
    chains:
      - name: input
        table: inet main
    error: "nftables_zz_test_chains: chain 'input' is already defined in: 'nftables_base_chains'."

  # Sets, maps and objects
  - name: "Set in an undefined table"
    sets:
      - test_set: type ipv4_addr
        table: inet nope
    error: "nftables_zz_test_sets: reference an undefined table 'inet nope'."

  - name: "Map in an undefined table"
    maps:
      - test_map: "type inet_service : ipv4_addr"
        table: inet nope
    error: "nftables_zz_test_maps: reference an undefined table 'inet nope'."

  - name: "Object in an undefined table"
    objects:
      - type: counter
        name: test_counter
        table: inet nope
    error: "nftables_zz_test_objects: reference an undefined table 'inet nope'."

  # Rules
  - name: "Rule in an undefined table"
    rules:
      - table: inet nope
        chain: input
        rules:
          10_test: accept
    error: "nftables_zz_test_rules: reference an undefined table 'inet nope'."

  - name: "Rule without chain"
    rules:
      - table: inet main
        rules:
          10_test: accept
    error: "must have a chain."

  - name: "Rule in an undefined chain"
    rules:
      - table: inet main
        chain: inptu
        rules:
          10_test: accept
    error: "nftables_zz_test_rules: reference an undefined chain 'inptu' in table 'inet main'."

  # Nftables syntax
  - name: "Invalid nftables syntax"
    rules:
      - table: inet main
        chain: input
        rules:
          99_test: this is not a valid rule
    error: "failed to validate"
