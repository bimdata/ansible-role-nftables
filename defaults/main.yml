---
nftables_pkg_name: nftables

nftables_svc_name: nftables
nftables_svc_state: started
nftables_svc_enabled: true

# Configuration
nftables_nft_bin: /usr/sbin/nft
nftables_config_file: /etc/nftables.conf
nftables_config_validation: true

nftables_flush_ruleset: true

# Variables agregation
_nftables_tables: "{{ lookup('template', 'get_vars.j2', template_vars=dict(app_name='nftables', var_type='table')) | from_json }}"
_nftables_chains: "{{ lookup('template', 'get_vars.j2', template_vars=dict(app_name='nftables', var_type='chain')) | from_json }}"
_nftables_defines: "{{ lookup('template', 'get_vars.j2', template_vars=dict(app_name='nftables', var_type='define')) | from_json }}"
_nftables_sets: "{{ lookup('template', 'get_vars.j2', template_vars=dict(app_name='nftables', var_type='set')) | from_json }}"
_nftables_maps: "{{ lookup('template', 'get_vars.j2', template_vars=dict(app_name='nftables', var_type='map')) | from_json }}"
_nftables_objects: "{{ lookup('template', 'get_vars.j2', template_vars=dict(app_name='nftables', var_type='object')) | from_json }}"
_nftables_rules: "{{ lookup('template', 'get_vars.j2', template_vars=dict(app_name='nftables', var_type='rule')) | from_json }}"

nftables_table_use_by_default: "{{ ((_nftables_tables | length) == 1) | ternary(_nftables_tables[0].name, '') }}"
