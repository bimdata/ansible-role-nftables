---
- name: "Install nftables package"
  ansible.builtin.package:
    name: "{{ nftables_pkg_name }}"
    state: present
  notify: Restart nftables service

- name: "Validate nftables variables"
  ansible.builtin.assert:
    that:
      - (_nftables_errors | length) == 0
    fail_msg: "{{ (['Invalid nftables variables:'] + _nftables_errors) | join('\n  - ') }}"
    quiet: true
  vars:
    _nftables_errors: "{{ lookup('template', 'check_vars.j2') | from_json }}"

- name: "Create nftables configuration file"
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ nftables_config_file }}"
    owner: root
    group: root
    mode: '0644'
    lstrip_blocks: true
    trim_blocks: true
    validate: "{{ (nftables_config_validation | bool) | ternary(nftables_nft_bin ~ ' -c -f %s', omit) }}"
  notify: Reload nftables service

- name: "Configure nftables service"
  ansible.builtin.service:
    name: "{{ nftables_svc_name }}"
    state: "{{ nftables_svc_state }}"
    enabled: "{{ nftables_svc_enabled }}"
  when: nftables_enable_service_management| bool
