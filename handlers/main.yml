---
- name: Restart nftables service
  ansible.builtin.service:
    name: "{{ nftables_svc_name }}"
    state: restarted
  when:
    - nftables_enable_service_management | bool
    - nftables_svc_state != 'stopped'
    - nftables_svc_enabled

- name: Reload nftables service
  ansible.builtin.service:
    name: "{{ nftables_svc_name }}"
    state: reloaded
  when:
    - nftables_enable_service_management | bool
    - nftables_svc_state != 'stopped'
    - nftables_svc_enabled
